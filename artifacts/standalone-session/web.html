<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1d21">
<meta name="color-scheme" content="light dark">
<title>QwenNote A2</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7;--surface:#ffffff;--surface-2:#f0f2f5;--surface-3:#e6e9ee;
  --border:#dfe2e7;--border-strong:#c4c9d1;
  --text:#14171c;--text-2:#4a515d;--text-3:#5f6773;
  --accent:#0b5cff;--accent-hover:#0849cc;--accent-press:#063da8;--accent-soft:#e8efff;--on-accent:#ffffff;
  --rec:#d1251b;--rec-soft:#fdeceb;--on-rec:#ffffff;
  --ok:#0d7a4f;--ok-soft:#e4f3eb;--warn:#8a5300;--warn-soft:#fff3dc;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-pop:0 16px 40px rgba(16,24,40,.18),0 2px 8px rgba(16,24,40,.08);
  --r-sm:6px;--r:8px;--r-lg:12px;
  --rail:76px;--top:56px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111316;--surface:#1a1d21;--surface-2:#22262b;--surface-3:#2c3137;
  --border:#2f343b;--border-strong:#434951;
  --text:#eef0f3;--text-2:#bcc2cb;--text-3:#a0a7b2;
  --accent:#4c8dff;--accent-hover:#6ea3ff;--accent-press:#93bbff;--accent-soft:#1c2b47;--on-accent:#06101f;
  --rec:#ff6b60;--rec-soft:#3b1e1c;--on-rec:#2a0805;
  --ok:#4cc38c;--ok-soft:#163327;--warn:#f2b45d;--warn-soft:#3a2b14;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-pop:0 16px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111316;--surface:#1a1d21;--surface-2:#22262b;--surface-3:#2c3137;
    --border:#2f343b;--border-strong:#434951;
    --text:#eef0f3;--text-2:#bcc2cb;--text-3:#a0a7b2;
    --accent:#4c8dff;--accent-hover:#6ea3ff;--accent-press:#93bbff;--accent-soft:#1c2b47;--on-accent:#06101f;
    --rec:#ff6b60;--rec-soft:#3b1e1c;--on-rec:#2a0805;
    --ok:#4cc38c;--ok-soft:#163327;--warn:#f2b45d;--warn-soft:#3a2b14;
    --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-pop:0 16px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);font-feature-settings:"tnum" 0}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,[role="tab"],summary{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.numeric,.badge,.timer{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.wrap{overflow-wrap:anywhere}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.skip-link{position:fixed;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:var(--r)}
.skip-link:focus{top:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--rec);border-color:var(--rec);color:var(--on-rec)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.link{background:transparent;border-color:transparent;color:var(--accent);padding:0 6px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled,.icon-btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-busy="true"]::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r);border:0;background:transparent;color:var(--text-2);cursor:pointer}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.icon-btn[aria-pressed="true"] .icon{fill:currentColor}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){border-color:var(--text-3)}
  .btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.danger:hover:not(:disabled){filter:brightness(.94)}
  .btn.ghost:hover:not(:disabled),.btn.link:hover:not(:disabled){background:var(--surface-2);border-color:transparent}
  .icon-btn:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
  .rail-item:hover{background:var(--surface-2);color:var(--text)}
  .note-item:hover{background:var(--surface-2)}
  .tab:hover{color:var(--text)}
  .conversation:hover{background:var(--surface-2)}
}
@keyframes spin{to{transform:rotate(360deg)}}
input[type="text"],input[type="search"],input[type="number"],select,textarea{width:100%;min-height:36px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);color:var(--text)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
select{padding-right:28px}
@media (pointer:coarse){input,select,textarea{font-size:16px}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--text-2)}
.field.inline{flex-direction:row;align-items:center;gap:8px}
.field.inline>span{white-space:nowrap}
.field.inline input{width:96px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;margin:0;cursor:pointer;transition:background-color .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s var(--ease-out)}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.rec{background:var(--rec-soft);color:var(--rec)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.rec{background:var(--rec);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.notice{padding:10px 12px;border-radius:var(--r);background:var(--surface-2);color:var(--text-2);font-size:13px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.accent{background:var(--accent-soft);color:var(--text)}

/* Shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100dvh}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-right:1px solid var(--border)}
.rail-brand{display:grid;place-items:center;width:40px;height:40px;margin-bottom:12px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;letter-spacing:.02em}
.rail-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:64px;min-height:56px;border:0;border-radius:10px;background:transparent;color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;line-height:1.2;text-align:center}
.rail-item .icon{width:22px;height:22px}
.rail-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail-spacer{flex:1}
.workspace{display:grid;grid-template-rows:var(--top) minmax(0,1fr);min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.view-title{font-size:16px;font-weight:700;white-space:nowrap}
.search{position:relative;display:flex;align-items:center;width:min(320px,32vw)}
.search .icon{position:absolute;left:10px;width:18px;height:18px;color:var(--text-3);pointer-events:none}
.search input{padding-left:34px;background:var(--surface-2);border-color:transparent}
.search input:focus{background:var(--surface);border-color:var(--accent)}
.topbar-spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.body{display:flex;min-height:0;min-width:0}
.main{flex:1;min-width:0;overflow:auto;outline:0}
.view{min-height:100%}
.view[data-panel="notes"],.view[data-panel="assistant"]{height:100%}
.page{padding:24px;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page.narrow{max-width:880px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h2{font-size:20px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flush{padding:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head p{margin-top:2px}
.rows{display:flex;flex-direction:column}
.row-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.rows>.row-item:first-child{border-top:0}
.placeholder{display:grid;place-items:center;text-align:center;padding:40px 16px;color:var(--text-2);gap:4px}
.placeholder strong{display:block;color:var(--text);font-size:15px}
.placeholder .icon{width:32px;height:32px;color:var(--text-3);margin:0 auto 6px}
.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite;margin:8px 0}
.skeleton.short{width:40%}
@keyframes shimmer{to{background-position:-200% 0}}
dl.facts{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 16px;margin:0}
dl.facts dt{color:var(--text-2);font-size:13px}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text-2);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
pre.code{margin:0;padding:12px;border-radius:var(--r);background:var(--surface-2);font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.markdown{line-height:1.65;overflow-wrap:anywhere}
.markdown>*:first-child{margin-top:0}
.markdown h3{font-size:17px;margin:18px 0 6px}
.markdown h4{font-size:15px;margin:14px 0 4px}
.markdown h5,.markdown h6{font-size:14px;margin:12px 0 4px}
.markdown p{margin:0 0 10px}
.markdown ul,.markdown ol{margin:0 0 10px;padding-left:22px}
.markdown li{margin:3px 0}
.markdown code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.markdown hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.markdown>*:last-child{margin-bottom:0}
.protocol{display:none}
body.show-protocol .protocol{display:revert}

/* Recorder control cluster */
.control-dock{display:flex;align-items:center;gap:8px;min-width:0}
.dock-state{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.dock-state.rec{background:var(--rec-soft);color:var(--rec)}
.dock-buttons{display:flex;gap:6px}
.dock-buttons .btn{min-height:32px;padding:0 12px;font-size:13px}
.dock-slot.large .control-dock{flex-direction:column;align-items:stretch;gap:12px}
.dock-slot.large .dock-state{display:none}
.dock-slot.large .dock-buttons .btn{min-height:44px;padding:0 18px;font-size:14px;flex:1}
.dock-slot.large .dock-assistant{display:none}

/* Home */
.home-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:16px;align-items:start}
.home-main,.home-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.recorder-card{display:flex;flex-direction:column;gap:12px}
.record-state{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;line-height:1.2}
.device-check{margin-top:6px;align-items:center}
.record-state .dot{width:12px;height:12px}
.timer{font-size:15px;color:var(--text-2);font-weight:600}
.transcript-row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--border);align-items:start}
.rows>.transcript-row:first-child{border-top:0}
.transcript-row .when{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.transcript-row.provisional .text{color:var(--text-3)}
.transcript-row .text{overflow-wrap:anywhere}
.live-rows{max-height:min(56dvh,560px);overflow:auto}
.recent-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 8px;border:0;border-radius:var(--r);background:transparent;text-align:left;cursor:pointer}
@media (hover:hover) and (pointer:fine){.recent-item:hover{background:var(--surface-2)}}

/* Notes */
.notes-layout{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%;min-height:0}
.notes-pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface)}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 8px}
.pane-search{margin:0 16px 8px;width:auto}
.note-list{flex:1;overflow:auto;padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.note-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 10px;border:0;border-radius:var(--r);background:transparent;text-align:left;cursor:pointer;color:var(--text)}
.note-item strong{font-weight:600;overflow-wrap:anywhere}
.note-item span{font-size:12px;color:var(--text-3)}
.note-item[aria-current="true"]{background:var(--accent-soft)}
.note-item[aria-current="true"] strong{color:var(--accent)}
.pane-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--border)}
.reader{min-width:0;min-height:0;overflow:auto;background:var(--bg)}
.reader-inner{max-width:960px;margin:0 auto;padding:20px 24px 40px}
.reader-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.reader-head h2{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.reader-head{flex-wrap:wrap}
.reader-head>.grow{flex:1 1 240px}
.reader-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.back-btn{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{position:relative;border:0;background:transparent;padding:10px 12px;color:var(--text-2);font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag-chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:13px}
.tag-chip input{position:absolute;opacity:0;pointer-events:none}
.tag-chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tag-chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(340px,86vw);padding:12px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:10px;transform-origin:top right;animation:pop .14s var(--ease-out)}
.menu-row{display:flex;align-items:flex-end;gap:8px}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

/* Assistant companion */
.companion-dock{width:400px;flex:none;border-left:1px solid var(--border);background:var(--surface);min-height:0;display:flex}
.companion{display:flex;flex-direction:column;min-height:0;width:100%;background:var(--surface)}
.companion-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
.companion-head h2{flex:1;font-size:15px}
.companion-head .icon.brand{color:var(--accent)}
.companion-head select{width:auto;min-height:32px;font-size:13px}
.conversation-list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.conversation{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border:0;border-radius:var(--r);background:transparent;text-align:left;cursor:pointer}
.conversation span{font-size:12px;color:var(--text-3)}
.thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.bubble.assistant:not(.pending){white-space:normal}
.bubble.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.bubble.assistant{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.bubble.pending{color:var(--text-3)}
.bubble-actions{display:flex;gap:4px;margin-top:6px}
.companion-tools{display:flex;align-items:center;gap:6px;padding:4px 12px;flex-wrap:wrap}
.composer{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:76px;max-height:40dvh}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.assistant-host{height:100%;display:flex}
.assistant-host .companion{max-width:980px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.assistant-host #companion-expand{display:none}

/* Settings */
.setting-field{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,260px);gap:8px 16px;padding:12px 0;border-top:1px solid var(--border);align-items:center}
.setting-field:first-of-type{border-top:0}
.setting-field .help{grid-column:1/-1;margin-top:-4px}
.setting-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.dev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dev-grid .wide{grid-column:1/-1}

/* Toasts and dialogs */
.toast-region{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:var(--r-lg);background:var(--text);color:var(--surface);box-shadow:var(--shadow-pop);animation:pop .16s var(--ease-out)}
.toast.error{background:var(--rec);color:var(--on-rec)}
.toast p{flex:1}
.toast button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
dialog{border:0;border-radius:var(--r-lg);padding:0;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:var(--shadow-pop)}
dialog::backdrop{background:rgba(10,14,20,.45)}
dialog[open]{animation:pop .18s var(--ease-out)}
.dialog-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 20px}

/* Phones and narrow windows */
@media (max-width:1100px){.companion-dock{position:fixed;inset:var(--top) 0 0 auto;width:min(420px,100vw);z-index:40;box-shadow:var(--shadow-pop)}}
@media (max-width:900px){.home-grid{grid-template-columns:minmax(0,1fr)}.dev-grid{grid-template-columns:minmax(0,1fr)}.search{display:none}}
@media (max-width:767px){
  :root{--top:52px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{grid-row:2;flex-direction:row;justify-content:space-around;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--border)}
  .rail-brand,.rail-spacer{display:none}
  .rail-item{width:auto;flex:1;min-height:52px;font-size:11px}
  .workspace{grid-row:1}
  .topbar{padding:0 12px;padding-top:env(safe-area-inset-top,0px);gap:8px}
  .topbar #companion-toggle span,.chip span{display:none}
  #dock-slot-top .dock-state{display:none}
  .dock-buttons .btn{padding:0 10px}
  .page{padding:16px}
  .notes-layout{grid-template-columns:minmax(0,1fr)}
  .notes-layout.reading .notes-pane{display:none}
  .notes-layout:not(.reading) .reader{display:none}
  .back-btn{display:inline-grid}
  .reader-inner{padding:12px 16px 32px}
  .reader-head{flex-wrap:wrap}
  .companion-dock{inset:0;width:100vw;padding-top:env(safe-area-inset-top,0px);z-index:60}
  .setting-field{grid-template-columns:minmax(0,1fr)}
  .transcript-row{grid-template-columns:minmax(0,1fr)}
  .transcript-row .when{padding:0}
  .transcript-row>button{justify-self:start}
  .toast-region{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .dot.rec{animation:none}
}

<script nonce="__NONCE__">
'use strict';

const CSRF='__CSRF__';

// Element builder. Text always goes through textContent; there is no HTML parsing.
const h=(tag,attrs={},children=[])=>{
  if(Array.isArray(attrs)||attrs instanceof Node){children=attrs;attrs={};}
  const node=document.createElement(tag);
  for(const [key,value] of Object.entries(attrs)){
    if(value===null||value===undefined||value===false)continue;
    if(key==='class')node.className=value;
    else if(key==='text')node.textContent=String(value);
    else if(key==='dataset')Object.assign(node.dataset,value);

    else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);
    else node.setAttribute(key,value===true?'':String(value));
  }
  for(const child of Array.isArray(children)?children:[children]){
    if(child===null||child===undefined||child===false)continue;
    node.append(child instanceof Node?child:document.createTextNode(String(child)));
  }
  return node;
};
function icon(name){
  const svg=document.createElementNS(SVG_NS,'svg');svg.setAttribute('class','icon');svg.setAttribute('aria-hidden','true');
  const use=document.createElementNS(SVG_NS,'use');use.setAttribute('href','#i-'+name);svg.append(use);return svg;
}
const prefs={
  get(key,fallback){try{return localStorage.getItem('qn.'+key)??fallback;}catch{return fallback;}},
  set(key,value){try{localStorage.setItem('qn.'+key,value);}catch{}}
};

// Locale and catalogs ------------------------------------------------------------
let locale=prefs.get('locale','')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh-CN':'en');

  vars={...vars};if(count!==undefined&&vars.count===undefined)vars.count=count;
  let value=catalog().ui[key]??CATALOGS.en.ui[key]??key;
  if(value&&typeof value==='object'){
    const rule=new Intl.PluralRules(locale,{type:'cardinal'}).select(Number(count??0));
    value=value[rule]??value.other??Object.values(value)[0];
  }
  return String(value).replace(/\{(\w+)\}/g,(_,name)=>vars[name]===undefined?'{'+name+'}':String(vars[name]));

const fmt={
  number:value=>new Intl.NumberFormat(locale).format(Number(value)||0),
  time:value=>{
    if(!value)return t('value.notReported');
    const ms=Number(value)<100000000000?Number(value)*1000:Number(value);
    return new Intl.DateTimeFormat(locale,{dateStyle:'medium',timeStyle:'short'}).format(new Date(ms));
  },
  duration:value=>{
    if(!Number.isFinite(Number(value)))return t('value.unknown');
    return fmt.clock(Math.round(Number(value)/1000));
  },
  ago:value=>{
    const seconds=Math.max(0,Date.now()/1000-Number(value));
    if(seconds<10)return t('time.justNow');
    const relative=new Intl.RelativeTimeFormat(locale,{numeric:'auto'});
    if(seconds<60)return relative.format(-Math.floor(seconds/10)*10,'second');
    if(seconds<3600)return relative.format(-Math.floor(seconds/60),'minute');
    if(seconds<86400)return relative.format(-Math.floor(seconds/3600),'hour');
    return relative.format(-Math.floor(seconds/86400),'day');
  },
  clock:seconds=>{
    seconds=Math.max(0,Math.floor(seconds));const hh=Math.floor(seconds/3600),mm=Math.floor(seconds%3600/60),ss=seconds%60;
    return (hh?hh+':'+String(mm).padStart(2,'0'):String(mm))+':'+String(ss).padStart(2,'0');
  },
  bytes:value=>{
    if(value===null||value===undefined||!Number.isFinite(Number(value)))return t('value.notReported');
    let n=Number(value),unit=0;const units=['B','KB','MB','GB','TB'];
    while(Math.abs(n)>=1024&&unit<units.length-1){n/=1024;unit++;}
    return `${new Intl.NumberFormat(locale,{maximumFractionDigits:unit?1:0}).format(n)} ${units[unit]}`;
  }
};

// Summaries and replies are Markdown. This renders the common subset as DOM nodes
// (headings, lists, rules, bold, italic, code); anything else stays plain text.
function inlineMarkdown(text){
  const nodes=[];let last=0;
  for(const match of text.matchAll(/\*\*([^*]+)\*\*|`([^`]+)`|\*([^*\s][^*]*)\*/g)){
    if(match.index>last)nodes.push(text.slice(last,match.index));
    if(match[1]!==undefined)nodes.push(h('strong',{text:match[1]}));
    else if(match[2]!==undefined)nodes.push(h('code',{text:match[2]}));
    else nodes.push(h('em',{text:match[3]}));
    last=match.index+match[0].length;
  }
  if(last<text.length)nodes.push(text.slice(last));
  return nodes;
}
function markdown(text){
  const root=h('div',{class:'markdown'});let list=null,paragraph=[];
  const flush=()=>{if(paragraph.length){root.append(h('p',{},inlineMarkdown(paragraph.join(' '))));paragraph=[];}};
  for(const raw of String(text??'').split('\n')){
    const line=raw.trimEnd();
    const heading=/^(#{1,6})\s+(.*)$/.exec(line),bullet=/^\s*[-*+]\s+(.*)$/.exec(line),numbered=/^\s*\d+[.)]\s+(.*)$/.exec(line);
    if(!line.trim()){flush();list=null;continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){flush();list=null;root.append(h('hr'));continue;}
    // Markdown headings start at h3: the page and the note title use h1 and h2.
    if(heading){flush();list=null;root.append(h('h'+Math.min(6,heading[1].length+2),{},inlineMarkdown(heading[2])));continue;}
    if(bullet||numbered){
      flush();const tag=bullet?'ul':'ol';
      if(!list||list.tagName.toLowerCase()!==tag){list=h(tag);root.append(list);}
      list.append(h('li',{},inlineMarkdown((bullet||numbered)[1])));continue;
    }
    list=null;paragraph.push(line.trim());
  }
  flush();return root;
}

let freshDepth=0;

async function api(action,body={},options={}){
  if(freshDepth>0)body={...body,refresh:true};
  const response=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify(body)});
  if(response.status===403){state.sessionExpired=true;const denied=new Error(t('err.session'));denied.code='session';throw denied;}
  if(response.status===404){const missing=new Error(t('err.restartNeeded'));missing.code='restart';throw missing;}
  if(!response.ok){

    const thrown=new Error(errorText(error));thrown.code=error.code;throw thrown;
  }
  if(options.download)return response;

  if(action==='documents'&&body.tool==='list_my_minutes'&&!body.arguments?.nextToken)state.notesSavedAt=savedAt;

// One request per action at a time from this page; the backend queues the rest.
// poll: 'await' waits for fresh status, false skips it, anything else schedules one.
async function run(action,body={},options={}){
  if(state.pending.has(action))return null;
  state.pending.add(action);paintBusy();
  const button=options.button;
  if(button){button.disabled=true;button.setAttribute('aria-busy','true');}
  try{
    const result=await api(action,body,options);
    if(options.success)toast(t(options.success));
    if(options.poll==='await')await poll(true);else if(options.poll!==false)schedulePoll();
    return result;
  }catch(error){toast(errorText(error),'error');return null;}
  finally{
    state.pending.delete(action);
    if(button){button.disabled=false;button.removeAttribute('aria-busy');}
    paintBusy();

let polling=false,pollAgain=false,lastPoll=0,pollTimer=null;
function schedulePoll(delay=150){clearTimeout(pollTimer);pollTimer=setTimeout(()=>poll(true),delay);}
async function poll(force=false){
  const now=Date.now();
  if(state.sessionExpired)return;
  // A refresh asked for during a poll runs after it, so the newest state always arrives.
  if(polling){if(force)pollAgain=true;return;}
  if(!force&&document.hidden&&now-lastPoll<10000)return;
  if(!force&&state.failures&&now-lastPoll<Math.min(30000,2000*2**state.failures))return;
  polling=true;lastPoll=now;
  try{
    const params=new URLSearchParams();
    if(state.cursor)params.set('since',state.cursor);
    // The settings catalog is most of the payload; it is sent again only when it changes.
    if(state.settingsRevision)params.set('settings_revision',state.settingsRevision);
    const query=params.toString();
    const response=await fetch('/api/status'+(query?'?'+query:''),{headers:{'Accept':'application/json'}});
    if(response.status===403){state.sessionExpired=true;paintConnection();toast(t('err.session'),'error');return;}
    if(!response.ok)throw new Error(t('err.failed'));
    const data=await response.json();
    if(data.setting_details)state.catalog={details:data.setting_details,choices:data.setting_choices||{}};
    state.settingsRevision=data.settings_revision||null;
    const announce=Boolean(state.cursor);
    if(!announce)lastDeviceState=data.device_check?.state||null;
    state.status=data;state.cursor=data.event_cursor||state.cursor;
    state.events.push(...(data.events||[]));state.events=state.events.slice(-256);
    for(const event of data.events||[]){
      if(announce&&event.kind==='device-check')announceDevice(event.data||{});
      if(announce&&event.kind==='note-status')noteStatusChanged(event.data||{});
    }
    state.failures=0;paintStatus();
  }catch{state.failures++;paintConnection();}
  finally{polling=false;if(pollAgain){pollAgain=false;schedulePoll(0);}}
}

// Notes ---------------------------------------------------------------------------
function documentData(result){
  if(!result||result.isError)throw new Error(t('mcp.readFailed'));
  if(result.structuredContent&&typeof result.structuredContent==='object')return result.structuredContent;
  const text=(result.content||[]).find(item=>item.type==='text')?.text;
  if(!text)return result;
  try{return JSON.parse(text);}catch{return {text};}
}
async function loadNotes(more=false){
  if(state.status&&state.status.mcp_available===false){state.notesLoaded=true;$('notes-status').textContent=t('notes.readerMissing');renderNotesList();return;}
  const args={pageSize:20};if(more&&state.notesToken)args.nextToken=state.notesToken;
  state.notesLoading=true;$('notes-status').textContent=t('state.loading');if(!more&&!state.notes.length)renderNotesList();paintHome();
  const raw=await run('documents',{tool:'list_my_minutes',arguments:args},{button:more?$('notes-more'):$('notes-reload'),poll:false});
  state.notesLoading=false;state.notesLoaded=true;
  if(!raw){$('notes-status').textContent=t('notes.loadFailed');renderNotesList();paintHome();return;}
  let result;try{result=documentData(raw);}catch(error){toast(errorText(error),'error');renderNotesList();return;}
  const items=Array.isArray(result.items)?result.items:[];
  state.notes=more?state.notes.concat(items):items;
  state.notesToken=result.hasMore&&result.nextToken?result.nextToken:null;
  $('notes-more').hidden=!state.notesToken;
  $('notes-status').textContent=t('notes.count',{},state.notes.length)+(state.notesSavedAt?' · '+t('saved.ago',{ago:fmt.ago(state.notesSavedAt)}):'');
  renderNotesList();paintHome();
}
function filteredNotes(){
  const query=state.noteFilter.trim().toLowerCase();
  return query?state.notes.filter(note=>(note.title||'').toLowerCase().includes(query)):state.notes;
}
function renderNotesList(){
  const target=$('notes-list');clear(target);
  if(state.notesLoading&&!state.notes.length){target.append(skeleton(6));}
  else if(!state.notes.length){target.append(empty('notes.emptyTitle','notes.emptyBody'));}
  else{
    const notes=filteredNotes();
    if(!notes.length)target.append(empty('notes.noMatchTitle','notes.noMatchBody','search'));
    for(const note of notes){
      const current=state.selected?.uuid===note.uuid;
      target.append(h('button',{class:'note-item',type:'button','aria-current':current?'true':null,onclick:()=>selectNote(note)},[
        h('strong',{text:note.title||t('note.untitled')}),
        h('span',{class:'numeric',text:`${fmt.time(note.gmtCreate)} · ${fmt.duration(note.durationMillis||0)}`})]));
    }
  }
  $('notes-empty').hidden=Boolean(state.selected)||Boolean(state.notes.length);
  $('notes-select').hidden=Boolean(state.selected)||!state.notes.length;
  $('note-detail').hidden=!state.selected;
}
function setFilter(value){state.noteFilter=value;$('notes-search').value=value;$('global-search').value=value;renderNotesList();}
async function selectNote(note){
  state.selected=note;state.noteTab='summary';state.transcriptRows=[];state.transcriptToken=null;state.translateToken=null;
  state.translateTargetsLoaded=false;state.tags=null;state.share=null;state.replacement=null;state.organizeLoaded=false;
  state.summaryText=null;state.summaryRevision=null;state.noteSavedAt=null;processingTries=0;loadNoteSize();
  clear($('transcript-rows'));clear($('translate-output'));clear($('tags-list'));clear($('replace-results'));clear($('share-state'));clear($('translate-target'));
  clear($('extras-output'));$('extras-output').append(h('p',{class:'small muted',text:t('details.help')}));
  setSummaryEditing(false);$('notes-layout').classList.add('reading');
  renderNotesList();renderSelectedNote();showNoteTab('summary');

  await Promise.all([refreshFavorite(),loadSummary()]);
}
async function reloadNote(){
  if(!state.selected)return;
  state.noteSavedAt=null;renderSelectedNote();
  await fresh(()=>{
    const reads=[refreshFavorite(),loadSummary()];
    if(state.transcriptRows.length)reads.push(loadTranscript(false));
    if(state.organizeLoaded)reads.push(loadTags(),loadShare());
    return Promise.all(reads);
  });
}
function renderSelectedNote(){

  const favorite=$('note-favorite');favorite.setAttribute('aria-pressed',note.collected?'true':'false');
  const label=t(note.collected?'note.unfavorite':'note.favorite');favorite.setAttribute('aria-label',label);favorite.title=label;

function showNoteTab(tab){

async function refreshFavorite(){

async function toggleFavorite(){

// Summary
function setSummaryEditing(editing){
  state.editingSummary=editing;$('summary-edit-area').hidden=!editing;$('summary-view').hidden=editing;
  $('summary-edit').hidden=editing;$('summary-regenerate').hidden=editing;

}
function paintSummary(){
  const view=$('summary-view');clear(view);
  if(state.summaryText===null)view.append(skeleton(5));
  else if(!state.summaryText.trim())view.append(empty('summary.emptyTitle','summary.emptyBody'));
  else view.append(markdown(state.summaryText));
}
async function loadSummary(){
  if(!state.selected)return;
  const note=state.selected;$('summary-state').textContent=t('state.loading');if(state.summaryText===null)paintSummary();
  const result=await run('note-summary',{task_uuid:note.uuid},{button:$('summary-load'),poll:false});
  if(state.selected!==note)return;
  if(!result){$('summary-state').textContent=t('summary.loadFailed');if(state.summaryText===null){state.summaryText='';paintSummary();}return;}
  if(result.processing){showProcessing('summary-view','summary-state',result.processing,note);return;}
  processingTries=0;
  if(result.empty){state.summaryText='';state.summaryRevision=null;paintSummary();$('summary-edit').hidden=true;
    $('summary-state').textContent=t(result.summary_failed?'summary.failedNone':'summary.none');return;}
  $('summary-edit').hidden=state.editingSummary;
  state.summaryText=result.text||'';state.summaryRevision=result.revision||null;paintSummary();
  $('summary-state').textContent=result.pending?t('summary.pending'):result.verified?t('summary.verified'):t('summary.unverified');
}
// The cloud is still recording, transcribing or summarizing this note: say so, and look again soon.
let processingTimer=null,processingTries=0;
function showProcessing(viewId,stateId,stage,note){
  const view=$(viewId);clear(view);
  view.append(h('div',{class:'notice'+(stage==='failed'?' warn':'')},[h('strong',{text:t('processing.'+stage)}),h('p',{class:'small muted',text:t(stage==='failed'?'processing.failedHelp':'processing.help')})]));
  if(stateId)$(stateId).textContent=t('processing.'+stage);
  clearTimeout(processingTimer);
  // Look again every 15 s for 5 minutes; after that the 86001/86003 notice or Reload brings it.
  if(stage!=='failed'&&++processingTries<=20)processingTimer=setTimeout(()=>{if(state.selected===note)fresh(reloadNote);},15000);
}
// A note-status push (transcription or summary finished, list changed) refreshes what is open.
let listReloadTimer=null;
function noteStatusChanged(data){
  if(state.selected&&(!data.uuid||data.uuid===state.selected.uuid))fresh(reloadNote);
  if(state.notesLoaded){clearTimeout(listReloadTimer);listReloadTimer=setTimeout(()=>fresh(loadNotes,false),1500);}
}
async function saveSummary(){
  if(state.selected&&notePath()==='mcp'){
    const text=$('summary-editor').value;
    const result=await mcpWrite('update_minutes_summary',{taskUuid:state.selected.uuid,summaryText:text},$('summary-save'),'summary.saved');
    if(result){state.summaryText=text;setSummaryEditing(false);paintSummary();fresh(loadSummary);}
    return;
  }
  if(!state.selected||!state.summaryRevision){toast(t('summary.loadFirst'),'error');return;}
  const text=$('summary-editor').value;
  const result=await run('note-summary-save',{task_uuid:state.selected.uuid,text,expected_revision:state.summaryRevision},{button:$('summary-save'),success:'summary.saved',poll:false});
  if(result){state.summaryText=result.text??text;state.summaryRevision=result.revision||state.summaryRevision;setSummaryEditing(false);paintSummary();$('summary-state').textContent=result.pending?t('summary.pending'):t('summary.verified');}
}
async function regenerateSummary(){
  if(!state.selected||!state.summaryRevision){toast(t('summary.loadFirst'),'error');return;}
  if(!await ask('summary.regenerateConfirmTitle','summary.regenerateConfirmText','summary.regenerate'))return;
  const result=await run('note-regenerate',{task_uuid:state.selected.uuid,expected_revision:state.summaryRevision},{button:$('summary-regenerate'),poll:false});
  if(result){
    if(typeof result.text==='string'){state.summaryText=result.text;paintSummary();}
    state.summaryRevision=result.revision||state.summaryRevision;
    $('summary-state').textContent=result.pending?t('summary.regenerationPending'):t('summary.regenerated');
  }
}

// Transcript
function resetTranscript(){state.transcriptRows=[];state.transcriptToken=null;clear($('transcript-rows'));$('transcript-more').hidden=true;}
async function loadTranscript(more=false){
  if(!state.selected)return;
  const note=state.selected;if(!more){resetTranscript();$('transcript-rows').append(skeleton(6));}
  const source=$('transcript-source').value;let result;
  if(source==='native'){
    result=await run('note-transcript',{task_uuid:note.uuid,next_token:more?state.transcriptToken:null},{button:more?$('transcript-more'):$('transcript-load'),poll:false});
  }else{
    const args={taskUuid:note.uuid};if(more&&state.transcriptToken)args.nextToken=state.transcriptToken;
    const raw=await run('documents',{tool:'get_minutes_transcription',arguments:args},{button:more?$('transcript-more'):$('transcript-load'),poll:false});
    try{result=raw?documentData(raw):null;}catch(error){toast(errorText(error),'error');result=null;}
  }
  if(state.selected!==note)return;
  if(!result){if(!more){clear($('transcript-rows'));$('transcript-rows').append(empty('transcript.emptyTitle','transcript.emptyBody'));}return;}
  if(result.processing){showProcessing('transcript-rows',null,result.processing,note);return;}
  const rows=result.paragraphs||[];
  state.transcriptRows=more?state.transcriptRows.concat(rows):rows;
  state.transcriptToken=(result.has_more??result.hasMore)?result.next_token||result.nextToken:null;
  $('transcript-more').hidden=!state.transcriptToken;renderSavedTranscript();
}
function renderSavedTranscript(){
  const target=$('transcript-rows');clear(target);
  if(!state.selected)return;
  if(!state.transcriptRows.length){target.append(empty('transcript.emptyTitle','transcript.emptyBody'));return;}
  for(const row of state.transcriptRows)target.append(transcriptRow(row,true));
}

// Translation
async function loadTranslateOptions(){
  if(!state.selected)return;
  const note=state.selected,result=await run('note-translate-options',{task_uuid:note.uuid},{button:$('translate-load-options'),poll:false});
  if(!result||state.selected!==note)return;
  state.translateTargetsLoaded=true;
  const select=$('translate-target');clear(select);
  for(const target of result.targets||[])select.append(h('option',{value:target.key,text:target.label}));
  select.disabled=!select.options.length;$('translate-run').disabled=!select.options.length;
  if(!select.options.length){clear($('translate-output'));$('translate-output').append(empty('translate.emptyTitle','translate.emptyBody'));}
}
function translatedSection(title,value){
  if(Array.isArray(value)){
    const list=h('div',{class:'rows'});
    value.forEach(item=>list.append(h('div',{class:'row-item'},h('div',{class:'stack tight'},[h('strong',{text:item.topic||item.content||item.summary||''}),item.summary&&item.topic?h('p',{class:'small muted',text:item.summary}):null]))));
    return h('section',{class:'card'},[h('h3',{text:title}),list]);
  }
  return h('section',{class:'card'},[h('h3',{text:title}),h('div',{style:'margin-top:8px'},value?markdown(value):h('p',{class:'small muted',text:t('value.notReported')}))]);
}
function renderTranslation(result,append=false){
  const target=$('translate-output');if(!append)clear(target);
  if(!append){
    if(result.title)target.append(h('h3',{text:result.title}));
    if(result.summary)target.append(translatedSection(t('note.summary'),result.summary));
    if(result.keypoints?.length)target.append(translatedSection(t('translate.keypoints'),result.keypoints));
    if(result.actions?.length)target.append(translatedSection(t('translate.actions'),result.actions));
  }
  const paragraphs=result.paragraphs||[];
  if(!paragraphs.length&&!append&&!result.summary)target.append(empty('translate.noContentTitle','translate.noContentBody'));
  else if(paragraphs.length){
    let list=target.querySelector('.translated-rows');
    if(!list){list=h('div',{class:'card rows translated-rows'});target.append(list);}
    paragraphs.forEach(row=>list.append(transcriptRow(row,true)));
  }
  state.translateToken=result.next_token||result.nextToken||null;$('translate-more').hidden=!state.translateToken;
}
async function runTranslation(more=false){
  if(!state.selected)return;
  const body=more&&state.translateToken?{task_uuid:state.selected.uuid,next_token:state.translateToken}:{task_uuid:state.selected.uuid,target_language:$('translate-target').value};
  if(!more&&!body.target_language){toast(t('translate.chooseFirst'),'error');return;}
  if(!more){clear($('translate-output'));$('translate-output').append(skeleton(6));}
  const result=await run('note-translate',body,{button:more?$('translate-more'):$('translate-run'),poll:false});
  if(result)renderTranslation(result,more);else if(!more)clear($('translate-output'));
}

// Details: read-only document tools, rendered as lists instead of raw JSON.
const PRIMARY_FIELDS=['content','text','title','name','keyword','topic','summary','fullSummary'];
const humanize=key=>String(key).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/[_-]+/g,' ').replace(/^./,first=>first.toUpperCase());
function readable(value){
  if(value===null||value===undefined||value==='')return h('p',{class:'small muted',text:t('value.notReported')});
  if(typeof value!=='object')return h('p',{class:'prose',text:String(value)});
  if(Array.isArray(value)){
    if(!value.length)return h('p',{class:'small muted',text:t('details.emptyList')});
    if(value.every(item=>item===null||typeof item!=='object'))return h('div',{class:'chips'},value.map(item=>badge(String(item))));
    const list=h('div',{class:'rows'});
    for(const item of value){
      const main=PRIMARY_FIELDS.map(field=>item[field]).find(text=>typeof text==='string'&&text);
      const meta=Object.entries(item).filter(([key,v])=>!PRIMARY_FIELDS.includes(key)&&v!==null&&typeof v!=='object').map(([key,v])=>`${humanize(key)}: ${v}`).join(' · ');
      list.append(h('div',{class:'row-item'},h('div',{class:'stack tight'},[h('p',{text:main||JSON.stringify(item)}),meta?h('span',{class:'tiny muted',text:meta}):null])));
    }
    return list;
  }
  const wrap=h('div',{class:'stack'}),scalars=[];
  const nested=Object.entries(value).filter(([,v])=>v!==null&&typeof v==='object');
  for(const [key,v] of Object.entries(value)){
    // A single nested list (such as items or keywords) is the content itself, so it gets no heading.
    if(v!==null&&typeof v==='object')wrap.append(nested.length===1?readable(v):h('section',{class:'stack tight'},[h('h3',{text:humanize(key)}),readable(v)]));
    else scalars.push([humanize(key),v===null||v===undefined?t('value.notReported'):String(v)]);
  }
  if(scalars.length)wrap.prepend(facts(scalars));
  return wrap;
}

function askTyped(title,text,word){

  $('typed-label').textContent=t('danger.typeWord',{word});input.value='';input.setCustomValidity('');input.oninput=()=>input.setCustomValidity('');
  $('typed-dialog').showModal();input.focus();
  return new Promise(resolve=>{
    const finish=value=>{$('typed-form').onsubmit=null;$('typed-cancel').onclick=null;$('typed-dialog').onclose=null;if($('typed-dialog').open)$('typed-dialog').close();resolve(value);};
    // A wrong word keeps the dialog open and says what to type, instead of closing with no message.
    $('typed-form').onsubmit=event=>{event.preventDefault();if(input.value.trim().toLowerCase()===word)finish(true);else{input.setCustomValidity(t('danger.typeWord',{word}));input.reportValidity();}};
    $('typed-cancel').onclick=()=>finish(false);$('typed-dialog').onclose=()=>finish(false);
  });
}

function updateAssistantCount(){$('assistant-count').textContent=`${fmt.number($('assistant-input').value.length)} / ${fmt.number(32000)}`;}
function addDraft(text){
  if(!text||!String(text).trim()){toast(t('assistant.nothingToAdd'),'error');return false;}
  const input=$('assistant-input'),addition=String(text).trim(),next=(input.value.trim()?input.value.replace(/\s+$/,'')+'\n\n':'')+addition;
  if(next.length>32000){toast(t('assistant.tooLong'),'error');return false;}
  input.value=next;updateAssistantCount();openCompanion(false);toast(t('assistant.added'));return true;
}
function renderThread(){
  const thread=$('assistant-thread');clear(thread);
  const messages=state.assistant.messages;
  if(!messages.length){thread.append(empty('assistant.emptyTitle','assistant.emptyBody','spark'));return;}
  for(const message of messages){
    const rich=message.role==='assistant'&&!message.pending&&message.text;
    const bubble=rich?h('div',{class:'bubble assistant'},markdown(message.text))
      :h('div',{class:`bubble ${message.role}${message.pending?' pending':''}`,text:message.pending?t('assistant.thinking'):(message.text||t('assistant.noReply'))});
    if(!rich){thread.append(bubble);continue;}
    const actions=h('div',{class:'bubble-actions'},[
      h('button',{class:'btn ghost small',type:'button',onclick:async()=>{try{await copyText(message.text);toast(t('assistant.copied'));}catch{toast(t('share.copyFailed'),'error');}}},[icon('copy'),t('assistant.copy')]),
      h('button',{class:'btn ghost small',type:'button',text:t('assistant.useAsDraft'),onclick:()=>addDraft(message.text)})]);
    thread.append(h('div',{style:'align-self:flex-start;max-width:88%'},[bubble,actions]));
  }
  thread.scrollTop=thread.scrollHeight;
}
function paintAssistantRoute(){$('assistant-route').textContent=state.protocol?state.assistant.route:'';}
function paintCompanionControls(){
  // A status snapshot taken before this page's reply arrived still says "in progress"; ignore it.
  const s=state.status||{},serverBusy=Boolean(s.assistant_in_progress)&&Number(s.server_time||0)>state.assistant.finishedAt;
  const busy=state.assistant.busy||serverBusy;
  if(!changed('companion-controls',[busy,state.assistant.busy,s.assistant_builtin_available,s.assistant_conversation_active,s.assistant_recovery_available,
    s.assistant_custom_configured,$('assistant-provider').value,state.selected?.uuid,state.selected?.title,$('assistant-context').checked,state.assistant.size]))return;
  $('assistant-new').disabled=busy;
  $('assistant-conversations').disabled=!s.assistant_builtin_available||busy;
  $('assistant-history').disabled=!s.assistant_conversation_active||busy;
  $('assistant-recover').hidden=!s.assistant_recovery_available;$('assistant-recover').disabled=busy;
  $('assistant-send').disabled=state.assistant.busy;$('assistant-cancel').hidden=!busy;
  const custom=$('assistant-provider').querySelector('[value="custom"]');
  custom.disabled=!s.assistant_custom_configured;if(custom.disabled&&$('assistant-provider').value==='custom')$('assistant-provider').value='builtin';
  $('assistant-provider').hidden=!s.assistant_custom_configured;
  $('assistant-context-wrap').hidden=!state.selected||$('assistant-provider').value!=='builtin';
  $('assistant-note').textContent=state.selected?t('assistant.contextNote',{title:state.selected.title||t('note.untitled')}):'';
  const size=state.assistant.size,sized=!$('assistant-context-wrap').hidden&&$('assistant-context').checked&&size?.uuid===state.selected?.uuid&&typeof size.characters==='number';
  $('assistant-note-size').hidden=!sized;
  $('assistant-note-size').textContent=sized?t(size.complete?'assistant.contextSize':'assistant.contextSizeMore',{count:fmt.number(size.characters)}):'';

function presentReply(result){
  const text=result.text||(result.cancelled?t('assistant.cancelled'):t('assistant.noReply'));
  const last=state.assistant.messages[state.assistant.messages.length-1];
  if(last&&last.role==='assistant'&&last.pending){last.pending=false;last.text=text;}else state.assistant.messages.push({role:'assistant',text});
  state.assistant.route=result.route||result.provider_outcome||'';renderThread();paintAssistantRoute();
}
function presentHistory(result){
  state.assistant.messages=(result.messages||[]).flatMap(row=>[{role:'user',text:row.query},{role:'assistant',text:row.text||t('assistant.pending')}]);
  state.assistant.route=result.route||'';renderThread();paintAssistantRoute();
}
async function sendAssistant(){
  const input=$('assistant-input'),text=input.value.trim(),provider=$('assistant-provider').value;
  if(!text){toast(t('assistant.empty'),'error');return;}
  if(state.assistant.busy)return;
  const body={text,provider,request_id:crypto.randomUUID()};
  if(provider==='builtin'&&$('assistant-context').checked&&state.selected)body.task_uuid=state.selected.uuid;
  state.assistant.busy=true;state.assistant.request=body.request_id;
  state.assistant.messages.push({role:'user',text},{role:'assistant',pending:true});
  input.value='';updateAssistantCount();renderThread();paintCompanionControls();
  const result=await run('assistant',body,{poll:false});
  state.assistant.busy=false;state.assistant.request=null;state.assistant.finishedAt=Date.now()/1000;
  if(result)presentReply(result);
  else{
    // Keep the request text so nothing typed is lost.
    const last=state.assistant.messages[state.assistant.messages.length-1];
    if(last?.pending)state.assistant.messages.pop();
    if(!input.value)input.value=text;updateAssistantCount();renderThread();
  }
  paintCompanionControls();schedulePoll();
}

  const request=state.assistant.request||state.status?.assistant_request_id;

// Settings ------------------------------------------------------------------------
// Each everyday setting appears once, in the group where you would look for it.
const SETTING_GROUPS=[
  {id:'recording',title:'settings.group.recording',help:'settings.group.recordingHelp',keys:['enable_incognito_mode','enable_incognito_transcribe','storage_type','enable_record_location','auto_realtime_asr']},
  {id:'language',title:'settings.group.language',help:'settings.group.languageHelp',keys:['default_source_language']},
  {id:'summary',title:'settings.group.summary',help:'generation.help',keys:['auto_generate_minutes','auto_generate_minutes_duration','auto_generate_minutes_duration_limit','default_minutes_template']}
];
function settingLabel(key){return has('setting.'+key)?t('setting.'+key):key;}
function choiceLabel(key,value,fallback){const name=`choice.${key}.${value}`;return has(name)?t(name):String(fallback??value);}
function displaySettingValue(row){
  if(row.value===null||row.value===undefined)return t('value.notReported');
  if(row.key==='default_minutes_template'){try{const parsed=JSON.parse(row.value);return parsed.title||parsed.description||row.value;}catch{return row.value;}}
  return choiceLabel(row.key,row.value,row.choices?.[row.value]||row.value);
}
function settingField(row,{choices,value,editor,disabled,groupId}){
  const select=h('select',{id:editor==='generation'?'generation-'+row.key:'setting-'+row.key,dataset:{key:row.key,editor:editor||'setting',current:String(value??''),group:groupId},disabled});
  for(const [choice,label] of Object.entries(choices||{}))select.append(h('option',{value:choice,text:choiceLabel(row.key,choice,label)}));
  if(value!==null&&value!==undefined&&![...select.options].some(option=>option.value===String(value)))select.append(h('option',{value:String(value),text:displaySettingValue(row)}));
  select.value=String(value??'');
  select.addEventListener('change',()=>{state.settingsDirty.add(groupId);const save=$('save-'+groupId);if(save)save.disabled=false;});
  const status=state.status||{};
  const labelBlock=h('label',{for:select.id},[
    h('strong',{class:'small',text:settingLabel(row.key)}),
    h('code',{class:'protocol tiny muted',style:'margin-left:8px',text:row.key})]);
  const field=h('div',{class:'setting-field'},[labelBlock,select]);
  if(has('settingHelp.'+row.key))field.append(h('p',{class:'help tiny muted',text:t('settingHelp.'+row.key)}));
  field.append(h('p',{class:'help tiny muted protocol',text:`${t('meaning.'+row.meaning_evidence)} · ${t('evidence.'+row.evidence)}`}));
  if((status.persistent_overrides||[]).includes(row.key))field.append(h('div',{class:'help notice warn',text:t('settings.overrideSaved')}));
  if((status.pending_restores||[]).includes(row.key))field.append(h('div',{class:'help row'},[h('span',{class:'tiny muted',text:t('settings.restoreAvailable')}),h('button',{class:'btn small',type:'button',text:t('action.restore'),onclick:event=>{const button=event.currentTarget;withReadiness(()=>restoreSetting(row.key,button));}})]));
  return field;
}
function paintSettings(force=false){
  if(!state.status)return;
  const status=state.status,gen=status.generation_group||{};
  const fresh=changed('settings',[state.settingsRevision,gen,status.pending_restores,status.persistent_overrides]);
  if(!force&&(!fresh||state.settingsDirty.size))return;
  state.settingsDirty.clear();
  const target=$('settings-list');clear(target);
  const details=state.catalog.details||[],byKey=Object.fromEntries(details.map(row=>[row.key,row])),used=new Set();
  if(!details.length){target.append(h('section',{class:'card'},empty('settings.emptyTitle','settings.emptyBody','sliders')));buildNotification();return;}
  const groups=SETTING_GROUPS.map(group=>({...group,rows:group.keys.map(key=>byKey[key]).filter(row=>row&&row.editable)}));
  groups.forEach(group=>group.rows.forEach(row=>used.add(row.key)));
  const others=details.filter(row=>row.editable&&!used.has(row.key)&&row.editor!=='notification');
  if(others.length)groups.push({id:'other',title:'settings.group.other',help:'settings.group.otherHelp',rows:others});
  for(const group of groups){
    if(!group.rows.length)continue;
    const card=h('section',{class:'card','aria-labelledby':'group-'+group.id},[
      h('div',{class:'card-head'},h('div',[h('h2',{id:'group-'+group.id,text:t(group.title)}),h('p',{class:'small muted',text:t(group.help)})]))]);
    for(const row of group.rows){
      if(row.editor==='generation')card.append(settingField(row,{choices:gen.choices?.[row.key],value:gen.values?.[row.key]??row.value,editor:'generation',disabled:!gen.available,groupId:group.id}));
      else card.append(settingField(row,{choices:row.choices,value:row.value,editor:'setting',groupId:group.id}));
    }
    const actions=h('div',{class:'setting-actions'});
    if(group.rows.some(row=>row.editor==='generation')){
      actions.append(h('span',{class:'tiny muted grow',text:gen.persistent_override_saved?t('settings.overrideSaved'):gen.pending_restore?t('settings.restoreAvailable'):gen.available?'':t('generation.unavailable')}));
      if(gen.pending_restore)actions.append(h('button',{id:'generation-restore',class:'btn small',type:'button',text:t('action.restore'),onclick:event=>{const button=event.currentTarget;withReadiness(()=>restoreGeneration(button));}}));
    }
    actions.append(h('button',{id:'save-'+group.id,class:'btn primary small',type:'button',text:t('settings.saveGroup'),disabled:true,onclick:event=>{const button=event.currentTarget;withReadiness(()=>saveGroup(card,group.id,button));}}));
    card.append(actions);target.append(card);
  }
  buildNotification();
}
async function saveGroup(card,groupId,button){
  const gen=state.status?.generation_group||{},byKey=Object.fromEntries((state.catalog.details||[]).map(row=>[row.key,row]));
  const changes=[],generationValues={};let generationChanged=false;
  for(const select of card.querySelectorAll('select[data-key]')){
    if(select.dataset.editor==='generation'){generationValues[select.dataset.key]=select.value;if(select.value!==select.dataset.current)generationChanged=true;}
    else if(select.value!==select.dataset.current)changes.push({row:byKey[select.dataset.key],value:select.value});
  }
  if(!changes.length&&!generationChanged){toast(t('settings.unchanged'));return;}
  if(generationChanged)for(const key of gen.keys||[])if(!(key in generationValues))generationValues[key]=gen.values?.[key];
  const override=changes.some(change=>change.row?.requires_persistent_override_confirmation)||(generationChanged&&gen.requires_persistent_override_confirmation);
  if(override&&!await ask('settings.overrideTitle','settings.overrideText','settings.override'))return;
  let ok=true;
  for(const change of changes){
    const result=await run('setting',{key:change.row.key,value:change.value,persistent_override:Boolean(change.row.requires_persistent_override_confirmation)},{button,poll:false});
    if(!result){ok=false;break;}
  }
  if(ok&&generationChanged)ok=Boolean(await run('generation',{values:generationValues,persistent_override:Boolean(gen.requires_persistent_override_confirmation)},{button,poll:false}));
  state.settingsDirty.delete(groupId);await poll(true);paintSettings(true);
  if(ok)toast(t('settings.saved'));
}

function buildNotification(){

  for(const [value,label] of Object.entries(group.method_choices||{}))method.append(h('option',{value,text:choiceLabel('agent_result_notify_type',value,label)}));
  method.value=current&&[...method.options].some(option=>option.value===current)?current:group.method;
  $('notification-current').textContent=serverText(group.current_organization_label||t('value.notReported'));

  if(group.current_organization_handle)select.value=group.current_organization_handle;else if(selected)select.value=selected;

async function saveNotification(){

function quotaNumber(value,unit){
  if(value===null||value===undefined)return t('quota.notReported');
  value=Number(value);if(!Number.isFinite(value))return t('quota.notReported');
  if(unit==='KB'){if(value>=1048576){value/=1048576;unit='GB';}else if(value>=1024){value/=1024;unit='MB';}}
  if(value>0&&value<0.001)return t('quota.lessThan',{value:quotaNumber(0.001,unit)});
  const countKey={minutes:'quota.minuteCount','篇':'quota.summaryCount','次':'quota.questionCount'}[unit];
  return countKey?t(countKey,{n:fmt.number(value)},value):fmt.number(value)+(unit?' '+unit:'');
}
function quotaTable(headers,rows){

  bind('settings-refresh','click',async()=>{const result=await run('refresh',{}, {button:$('settings-refresh'),success:'state.refreshed',poll:'await'});if(result)paintSettings(true);});
  bind('notification-load-orgs','click',loadOrganizations);bind('notification-save','click',()=>withReadiness(saveNotification));bind('notification-restore','click',()=>withReadiness(restoreNotification));
  bind('device-load','click',()=>loadDevice(false));bind('device-refresh','click',()=>loadDevice(true));
  bind('device-save-name','click',()=>withReadiness(()=>saveDeviceName(false)));bind('device-restore-name','click',()=>withReadiness(()=>saveDeviceName(true)));
  bind('quotas-load','click',loadThenReload('quotas-load',loadQuotas));bind('quota-orgs','click',loadQuotaOrganizations);
  // Dev
  bind('task-refresh','click',()=>run('record-task',{}, {button:$('task-refresh')}));
  bind('cache-clear','click',async()=>{if(await ask('cache.clearTitle','cache.clearText','cache.clear'))await run('cache-clear',{}, {button:$('cache-clear'),success:'cache.cleared',poll:'await'});});
  bind('capture-start','click',startCapture);bind('capture-stop','click',()=>run('capture-stop',{}, {button:$('capture-stop')}));
  bind('mcp-run','click',runMcpTool);bind('rtc-load-options','click',loadThenReload('rtc-load-options',loadRtcOptions));
  bind('rtc-begin','click',startRtc);bind('rtc-end','click',()=>run('rtc-stop',{}, {button:$('rtc-end')}));
  // Dialogs and keys
  $('confirm-ok').addEventListener('click',()=>settleConfirm(true));$('confirm-cancel').addEventListener('click',()=>settleConfirm(false));
  $('confirm-dialog').addEventListener('cancel',event=>{event.preventDefault();settleConfirm(false);});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.companionOpen&&!document.querySelector('dialog[open]'))closeCompanion();});
  window.addEventListener('hashchange',()=>showView(viewFromHash()));
  showView(viewFromHash());
  poll();setInterval(()=>poll(),2000);setInterval(paintRecording,1000);
}
initialize();
})();
</script>
